<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amor mío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E7;
    --cream-2:#FFFBF5;
    --mane:#D68A3C;
    --mane-dark:#A5631F;
    --face:#E7A75B;
    --muzzle:#FFF8EE;
    --shirt:#7FB2DD;
    --shirt-dark:#4E85B8;
    --gold:#F4C94A;
    --brown:#4A2E1B;
    --brown-soft:#7A5A3F;
    --wood:#B5763B;
    --wood-dark:#8A5726;
    --string:#F1E4C8;
    --pink:#E8A0BF;
    --pink-dark:#C96F95;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--brown);
    overflow-x:hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(214,138,60,0.12), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(127,178,221,0.16), transparent 45%);
  }

  .screen{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:44px 20px 64px;
  }

  .hidden{ display:none !important; }

  h1.title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(2.6rem, 9vw, 4.2rem);
    color:var(--mane-dark);
    margin:0 0 6px;
    text-align:center;
    letter-spacing:0.5px;
    text-shadow: 2px 3px 0 rgba(255,255,255,0.6);
  }

  .subtitle{
    font-family:'Nunito', sans-serif;
    font-style:italic;
    font-weight:600;
    color:var(--brown-soft);
    font-size:1.05rem;
    margin:0 0 22px;
    text-align:center;
  }

  .lion-wrap{
    position:relative;
    width:min(66vw, 260px);
    margin-bottom:14px;
    cursor:pointer;
    user-select:none;
    animation: breathe 4.5s ease-in-out infinite;
    filter: drop-shadow(0 16px 22px rgba(74,46,27,0.28));
  }

  @keyframes breathe{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-8px); }
  }

  .lion-svg{ width:100%; height:auto; display:block; }

  #mane{
    transform-box: view-box;
    transform-origin: 120px 140px;
    animation: maneSway 3.2s ease-in-out infinite alternate;
  }

  @keyframes maneSway{
    from{ transform: rotate(-3deg); }
    to{ transform: rotate(3deg); }
  }

  .eyelid{
    transform-box: view-box;
    transform: scaleY(0);
  }
  .eyelid-left{ transform-origin: 100px 130px; }
  .eyelid-right{ transform-origin: 140px 130px; }

  .lion-wrap.winking .eyelid-right{
    animation: wink 0.55s ease-in-out 1;
  }

  @keyframes wink{
    0%{ transform:scaleY(0); }
    45%{ transform:scaleY(1); }
    100%{ transform:scaleY(0); }
  }

  .tail{
    transform-box: view-box;
    transform-origin: 175px 235px;
    animation: tailWag 1.6s ease-in-out infinite alternate;
  }
  @keyframes tailWag{
    from{ transform: rotate(-8deg); }
    to{ transform: rotate(10deg); }
  }

  .bubble{
    position:relative;
    background:var(--cream-2);
    border:2px solid var(--shirt);
    border-radius:20px;
    padding:14px 22px;
    max-width:320px;
    text-align:center;
    font-weight:700;
    font-size:1.05rem;
    color:var(--brown);
    margin-bottom:34px;
    opacity:0;
    transform:translateY(8px);
    animation: bubble-in 0.6s ease 0.5s forwards;
  }

  .bubble::after{
    content:"";
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-bottom:12px solid var(--shirt);
  }
  .bubble::before{
    content:"";
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:10px solid var(--cream-2);
    z-index:1;
  }

  @keyframes bubble-in{
    to{ opacity:1; transform:translateY(0); }
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
    max-width:340px;
  }

  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.08rem;
    color:var(--cream-2);
    background:linear-gradient(180deg, var(--mane) 0%, var(--mane-dark) 100%);
    border:none;
    border-radius:16px;
    padding:16px 20px;
    cursor:pointer;
    box-shadow:0 8px 0 var(--mane-dark), 0 12px 18px rgba(74,46,27,0.25);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn.blue{
    background:linear-gradient(180deg, var(--shirt) 0%, var(--shirt-dark) 100%);
    box-shadow:0 8px 0 var(--shirt-dark), 0 12px 18px rgba(78,133,184,0.28);
  }

  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 var(--mane-dark), 0 4px 10px rgba(74,46,27,0.25);
  }
  .btn.blue:active{
    box-shadow:0 2px 0 var(--shirt-dark), 0 4px 10px rgba(78,133,184,0.28);
  }

  .btn.pink{
    background:linear-gradient(180deg, var(--pink) 0%, var(--pink-dark) 100%);
    box-shadow:0 8px 0 var(--pink-dark), 0 12px 18px rgba(201,111,149,0.28);
  }
  .btn.pink:active{
    box-shadow:0 2px 0 var(--pink-dark), 0 4px 10px rgba(201,111,149,0.28);
  }

  .back-btn{
    align-self:flex-start;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    color:var(--shirt-dark);
    background:var(--cream-2);
    border:2px solid var(--shirt);
    border-radius:12px;
    padding:9px 16px;
    cursor:pointer;
    margin-bottom:22px;
    font-size:0.95rem;
  }
  .back-btn:hover{ background:var(--shirt); color:var(--cream-2); }

  h2.screen-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    color:var(--mane-dark);
    font-size:clamp(1.5rem, 6vw, 2rem);
    text-align:center;
    margin:0 0 26px;
  }

  .phrase-field{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px 16px;
    max-width:560px;
  }

  .phrase-item{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--mane-dark);
    background:var(--cream-2);
    border:2px solid var(--mane);
    border-radius:14px;
    padding:8px 14px;
    font-size:0.98rem;
    opacity:0;
    transform:scale(0.6);
    animation: pop-in 0.4s ease forwards;
  }

  .phrase-item.blue-style{
    color:var(--shirt-dark);
    border-color:var(--shirt);
  }

  @keyframes pop-in{
    to{ opacity:1; transform:scale(1); }
  }

  /* ---------- Música screen: animated instrument background ---------- */

  #musica{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg, #FFF6E9 0%, #FBE7C7 100%);
    z-index:0;
  }

  .instrument-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  .instrument{
    position:absolute;
    will-change: transform;
  }

  .instrument svg{ width:100%; height:100%; display:block; }

  .instrument.float{ animation-name: instFloat; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .instrument.bounce{ animation-name: instBounce; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }

  @keyframes instFloat{
    0%,100%{ transform: translateY(0) rotate(var(--rot, 0deg)); }
    50%{ transform: translateY(-22px) rotate(calc(var(--rot, 0deg) + 6deg)); }
  }

  @keyframes instBounce{
    0%,100%{ transform: translateY(0) rotate(var(--rot, 0deg)) scale(1); }
    30%{ transform: translateY(-34px) rotate(calc(var(--rot, 0deg) - 8deg)) scale(1.05); }
    55%{ transform: translateY(0) rotate(var(--rot, 0deg)) scale(0.96); }
    75%{ transform: translateY(-12px) rotate(calc(var(--rot, 0deg) + 4deg)) scale(1.02); }
  }

  .musica-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  .playlist-cover{
    width:min(70vw, 260px);
    aspect-ratio:1/1;
    border-radius:24px;
    background:linear-gradient(145deg, var(--pink) 0%, var(--pink-dark) 55%, var(--wood-dark) 100%);
    box-shadow:0 18px 34px rgba(74,46,27,0.28), 0 0 0 6px var(--cream-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }

  .playlist-cover::before{
    content:"";
    position:absolute;
    width:150%;
    height:150%;
    background:radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 60%);
    top:-40%;
    left:-30%;
  }

  .vinyl{
    width:52%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:repeating-radial-gradient(circle, var(--brown) 0 2px, #3a2314 2px 6px);
    border:6px solid var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 6s linear infinite;
    margin-bottom:14px;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .vinyl::after{
    content:"";
    width:22%;
    height:22%;
    border-radius:50%;
    background:var(--gold);
    border:2px solid var(--brown);
  }

  .cover-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.7rem;
    color:var(--cream-2);
    letter-spacing:1px;
    text-shadow:0 2px 4px rgba(0,0,0,0.25);
  }

  .cover-sub{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:var(--cream-2);
    opacity:0.9;
  }

  .btn.playlist-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    width:100%;
    max-width:280px;
  }
</style>
</head>
<body>

<script>
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    window.scrollTo({top:0, behavior:'instant'});
  }

  function fillField(fieldId, text, styleClass, count){
    const field = document.getElementById(fieldId);
    if(field.childElementCount > 0) return;
    for(let i = 0; i < count; i++){
      const span = document.createElement('span');
      span.className = 'phrase-item' + (styleClass ? ' ' + styleClass : '');
      span.textContent = text;
      span.style.animationDelay = (i * 0.045) + 's';
      field.appendChild(span);
    }
  }

  fillField('teamoField', 'Te Amo❤️', '', 26);
  fillField('perdonField', 'perdón, eres mi mundo entero', 'blue-style', 26);

  function guitarSVG(){
    return `

        <circle cx="20" cy="38" r="6" fill="var(--wood-dark)"/>
        <line x1="20" y1="26" x2="20" y2="56" stroke="var(--string)" stroke-width="1"/>
        <line x1="18" y1="26" x2="18" y2="56" stroke="var(--string)" stroke-width="1"/>
        <line x1="22" y1="26" x2="22" y2="56" stroke="var(--string)" stroke-width="1"/>
      </svg>`;
  }

  function accordionSVG(){

        <rect x="38" y="6" width="12" height="32" rx="3" fill="var(--wood-dark)"/>
        <circle cx="5" cy="12" r="1.3" fill="var(--gold)"/><circle cx="9" cy="12" r="1.3" fill="var(--gold)"/>

        <circle cx="5" cy="22" r="1.3" fill="var(--gold)"/><circle cx="9" cy="22" r="1.3" fill="var(--gold)"/>
        <rect x="14" y="4" width="4" height="36" fill="var(--pink-dark)"/>
        <rect x="19" y="8" width="4" height="28" fill="var(--pink)"/>
        <rect x="24" y="4" width="4" height="36" fill="var(--pink-dark)"/>
        <rect x="29" y="8" width="4" height="28" fill="var(--pink)"/>
        <rect x="34" y="4" width="4" height="36" fill="var(--pink-dark)"/>
        <rect x="40" y="14" width="7" height="3" fill="var(--string)"/>
        <rect x="40" y="19" width="7" height="3" fill="var(--string)"/>
        <rect x="40" y="24" width="7" height="3" fill="var(--string)"/>
      </svg>`;
  }

  function drumSVG(){
    return `
      <svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="23" cy="12" rx="19" ry="8" fill="var(--string)" stroke="var(--wood-dark)" stroke-width="2"/>
        <rect x="4" y="12" width="38" height="22" fill="var(--pink)" stroke="var(--wood-dark)" stroke-width="2"/>
        <ellipse cx="23" cy="34" rx="19" ry="8" fill="var(--pink-dark)" stroke="var(--wood-dark)" stroke-width="2"/>
        <line x1="6" y1="15" x2="6" y2="31" stroke="var(--gold)" stroke-width="2"/>
        <line x1="17" y1="19" x2="17" y2="35" stroke="var(--gold)" stroke-width="2"/>
        <line x1="29" y1="19" x2="29" y2="35" stroke="var(--gold)" stroke-width="2"/>
        <line x1="40" y1="15" x2="40" y2="31" stroke="var(--gold)" stroke-width="2"/>
        <path d="M8,4 L20,14" stroke="var(--wood-dark)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M34,6 L24,15" stroke="var(--wood-dark)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="7" cy="3" r="2.4" fill="var(--wood-dark)"/>
        <circle cx="35" cy="5" r="2.4" fill="var(--wood-dark)"/>
      </svg>`;
  }

  function cajonSVG(){
    return `
      <svg viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="32" height="40" rx="2" fill="var(--wood)" stroke="var(--wood-dark)" stroke-width="2"/>
        <rect x="10" y="10" width="20" height="14" rx="1.5" fill="var(--wood-dark)" opacity="0.85"/>
        <circle cx="20" cy="17" r="2" fill="var(--gold)"/>
        <line x1="4" y1="30" x2="36" y2="30" stroke="var(--wood-dark)" stroke-width="1.5"/>
        <line x1="4" y1="36" x2="36" y2="36" stroke="var(--wood-dark)" stroke-width="1.5"/>
      </svg>`;
  }

  function buildInstrumentBackground(){
    const bg = document.getElementById('instrumentBg');
    if(!bg || bg.childElementCount > 0) return;
    const makers = [guitarSVG, accordionSVG, drumSVG, cajonSVG];
    const ratios = [1.5, 52/44, 1, 40/48];
    const count = 18;
    for(let i = 0; i < count; i++){
      const idx = i % makers.length;
      const div = document.createElement('div');
      div.className = 'instrument ' + (i % 3 === 0 ? 'bounce' : 'float');
      const size = 36 + Math.random() * 30;
      const left = Math.random() * 90;
      const top = Math.random() * 88;
      const rot = (Math.random() * 30 - 15).toFixed(1);
      const duration = 3.2 + Math.random() * 2.6;
      const delay = Math.random() * 3;
      div.style.width = size + 'px';
      div.style.height = (size / ratios[idx]) + 'px';
      div.style.left = left + '%';
      div.style.top = top + '%';
      div.style.setProperty('--rot', rot + 'deg');
      div.style.transform = `rotate(${rot}deg)`;
      div.style.animationDuration = duration + 's';
      div.style.animationDelay = delay + 's';
      div.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
      div.innerHTML = makers[idx]();
      bg.appendChild(div);
    }
  }

  buildInstrumentBackground();

  window.addEventListener('load', () => {
    const wrap = document.getElementById('lionWrap');
    setTimeout(() => wrap.classList.add('winking'), 350);
  });

  document.getElementById('lionWrap').addEventListener('click', function(){
    this.classList.remove('winking');
    void this.offsetWidth;
    this.classList.add('winking');
  });
</script>

</body>
